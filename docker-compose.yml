
services:
  backend:
    build: ./backend
    container_name: a8-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: a8-frontend
    ports:
      - "8081:8081"
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: a8-mysql
    environment:
      MYSQL_DATABASE: a8
      MYSQL_USER: a8_user
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p$${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
